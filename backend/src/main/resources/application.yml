spring:
  application:
    name: asset-rental-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/asset_rental}
    username: ${DB_USER:asset_rental}
    password: ${DB_PASSWORD:asset_rental}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  error:
    include-stacktrace: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
